<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Dashboard — MathBridge</title>
<meta name="description" content="Build AA HL formative quizzes from the MathBridge question bank, see student answers live and return marks and comments.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%231F4E79'/%3E%3Ctext x='20' y='27' font-family='Georgia' font-size='18' fill='white' text-anchor='middle'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/bank.css">
<link rel="stylesheet" href="../assets/quiz.css">
</head>
<body>
<header class="topbar"><div class="wrap">
  <a class="brand" href="../">Math<span>Bridge</span></a>
  <nav>
    <a href="#quizzes" id="nav-quizzes">Quizzes</a>
    <a href="#new" id="nav-new">New quiz</a>
    <a href="../formative-bank/">Formative bank</a>
    <button class="linkbtn" id="disconnect" hidden>Sign out</button>
  </nav>
  <div class="zoom"><span>Text size</span><div class="zg" role="group" aria-label="Text size"><button data-scale="1" aria-pressed="true" title="Normal">A</button><button data-scale="1.22" aria-pressed="false" title="Large">A</button><button data-scale="1.5" aria-pressed="false" title="Projector">A</button></div></div>
</div></header>

<main class="wrap" id="view"></main>
<div id="bar"></div>


<script src="../assets/config.js"></script>
<script src="../assets/items.js"></script>
<script src="../assets/common.js"></script>
<script>
(function () {
  const { ITEMS, BY_ID, TOPIC, PAPER, esc, stripTags, store, message, headerHTML, msHTML, quizMax, toast, when, duration } = MB;
  const $ = id => document.getElementById(id);
  const view = $("view"), bar = $("bar");
  MB.zoom();

  let apiUrl = MB.apiUrl(), key = store.get("mb-key") || "";
  let quizzes = [], subsByQuiz = {}, pollTimer = null, dirty = false;
  const api = (action, body) => MB.api(action, Object.assign({ key }, body || {}), apiUrl);

  const STATUS_LABEL = { submitted: "New", resubmitted: "Resubmitted", marking: "Draft saved", returned: "Returned" };
  const COMMENTS = [
    "Correct method — arithmetic slip.",
    "Show your working: the method marks are in the steps.",
    "Give the exact answer, not a decimal.",
    "Give your answer to 3 significant figures.",
    "A reason (R mark) is needed: say why.",
    "Check the domain / reject the invalid value.",
    "Use the result from the previous part (\"hence\").",
    "Sign error.",
    "Well done — fully correct.",
    "Compare with the markscheme and try again."
  ];

  function stopPoll() { clearInterval(pollTimer); pollTimer = null; }
  function poll(fn, ms) { stopPoll(); pollTimer = setInterval(() => { if (!document.hidden) fn(); }, ms); }
  function setBar(html) { bar.innerHTML = html; document.body.classList.toggle("has-actionbar", !!html); }
  function studentLink(id) {
    const u = new URL("../quiz/", location.href);
    u.searchParams.set("q", id);
    if (!MB.configured()) u.searchParams.set("api", apiUrl);
    return u.toString();
  }
  function navCurrent(name) {
    ["quizzes", "new"].forEach(n => $("nav-" + n).toggleAttribute("aria-current", n === name));
    if (name) $("nav-" + name).setAttribute("aria-current", "page");
  }
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- connect ---------- */
  function renderConnect(err) {
    stopPoll(); setBar(""); navCurrent(null);
    $("disconnect").hidden = true;
    view.innerHTML = `<div class="pagehead"><p class="eyebrow">Teacher dashboard</p><h1>Connect to your quiz sheet</h1>
      <p>Quizzes, answers and feedback are kept in your own Google Sheet. Set it up once with <a href="https://github.com/jameswangjianbo-netizen/mathbridge-site/blob/main/backend/SETUP.md" target="_blank" rel="noopener">these steps</a> (about five minutes), then sign in here with your teacher key.</p></div>
      <form class="card narrow" id="cform" novalidate>
        ${MB.configured() ? "" : `<div class="field"><label for="curl">Web app URL</label><input id="curl" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(apiUrl)}" required>
          <small>From Deploy → Manage deployments in Apps Script. To stop entering it here, paste it into <code>assets/config.js</code>.</small></div>`}
        <div class="field"><label for="ckey">Teacher key</label><input id="ckey" type="password" autocomplete="current-password" required>
          <small>Logged by <code>setup()</code> when you first ran it. It stays on this device only.</small></div>
        <p class="err" id="cerr" role="alert">${esc(err || "")}</p>
        <button class="btn primary big" type="submit" id="cbtn">Sign in</button>
      </form>`;
    $("cform").onsubmit = async e => {
      e.preventDefault();
      const url = MB.configured() ? apiUrl : $("curl").value.trim();
      const k = $("ckey").value.trim();
      if (!MB.okUrl(url)) { $("cerr").textContent = "That doesn't look like an Apps Script web app URL. It should end in /exec."; return; }
      if (!k) { $("cerr").textContent = "Enter your teacher key."; return; }
      $("cbtn").disabled = true; $("cerr").textContent = "";
      try {
        await MB.api("checkKey", { key: k }, url);
        apiUrl = url; key = k;
        store.set("mb-api", url); store.set("mb-key", k);
        route();
      } catch (er) { $("cerr").textContent = message(er); $("cbtn").disabled = false; }
    };
  }
  $("disconnect").onclick = () => { store.del("mb-key"); key = ""; location.hash = ""; renderConnect(); };

  /* ---------- router ---------- */
  async function route() {
    if (!apiUrl || !key) { renderConnect(); return; }
    $("disconnect").hidden = false;
    const [name, a, b] = (location.hash.slice(1) || "quizzes").split("/");
    lastHash = location.hash;
    const preset = new URLSearchParams(location.search).get("items");
    dirty = false;
    try {
      if (preset) history.replaceState(null, "", location.pathname + location.hash);  // use the bank's picks once
      if (name === "new") return renderBuilder(null, preset ? preset.split(",") : []);
      if (name === "edit") return renderBuilder(a);
      if (name === "subs") return await renderSubs(a);
      if (name === "mark") return await renderMark(a, decodeURIComponent(b || ""));
      return await renderQuizzes();
    } catch (e) {
      if (e && e.code === "bad_key") { store.del("mb-key"); key = ""; renderConnect(message(e)); return; }
      view.innerHTML = `<div class="card narrow" style="margin-top:3rem"><h2>Couldn't load</h2><p>${esc(message(e))}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    }
  }
  let lastHash = location.hash, reverting = false;
  window.addEventListener("hashchange", () => {
    if (reverting) { reverting = false; return; }
    if (dirty && !confirm("You have unsaved changes on this page. Leave without saving?")) {
      reverting = true; location.hash = lastHash; return;
    }
    lastHash = location.hash;
    route();
  });

  async function loadQuizzes() { quizzes = (await api("listQuizzes")).quizzes; return quizzes; }

  /* ---------- quizzes list ---------- */
  async function renderQuizzes() {
    stopPoll(); setBar(""); navCurrent("quizzes");
    if (!quizzes.length) view.innerHTML = `<div class="pagehead"><h1>Your quizzes</h1><p class="hint">Loading…</p></div>`;
    await loadQuizzes();
    const draw = () => {
      const live = quizzes.filter(q => !/^\[archived\]/.test(q.className));
      view.innerHTML = `<div class="pagehead"><p class="eyebrow">Teacher dashboard</p><h1>Your quizzes</h1>
        <p>Share a quiz link with your class. Answers arrive here as students submit them; mark each part and return it, and the student sees your feedback straight away.</p>
        <div class="btnrow" style="margin-top:1.8rem"><a class="btn primary big" href="#new" style="text-decoration:none">New quiz</a><span class="hint">Or pick questions in the <a href="../formative-bank/">formative bank</a> with “+ Quiz”.</span></div></div>
        ${live.length ? `<div class="qlist">${live.map(q => {
          const link = studentLink(q.id);
          return `<div class="qrow">
            <div><h3>${esc(q.title)}</h3>
              <div class="sub">${q.className ? `<span>${esc(q.className)}</span>` : ""}<span>${q.items.length} questions &middot; ${quizMax(q.items)} marks</span>${q.minutes ? `<span>${q.minutes} min</span>` : ""}<span class="pill ${q.open ? "open" : "closed"}">${q.open ? "Open" : "Closed"}</span></div></div>
            <div class="counts"><span class="w"><b>${q.counts.waiting}</b>to mark</span><span><b>${q.counts.returned}</b>returned</span></div>
            <div class="btnrow">
              <a class="btn primary" href="#subs/${q.id}" style="text-decoration:none">Answers &amp; marking</a>
              <button class="btn" data-copy="${esc(link)}">Copy student link</button>
              <a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">Preview</a>
              <button class="btn" data-toggle="${q.id}">${q.open ? "Close" : "Reopen"}</button>
              <a class="btn" href="#edit/${q.id}" style="text-decoration:none">Edit</a>
              <button class="btn danger" data-archive="${q.id}">Archive</button>
            </div></div>`;
        }).join("")}</div>` : `<div class="empty-state"><p>No quizzes yet.</p><a class="btn primary" href="#new" style="text-decoration:none">Build your first quiz</a></div>`}`;
      view.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy));
      view.querySelectorAll("[data-toggle]").forEach(b => b.onclick = async () => {
        const q = quizzes.find(x => x.id === b.dataset.toggle);
        b.disabled = true;
        try { await api("saveQuiz", { quiz: Object.assign({}, q, { open: !q.open }) }); await loadQuizzes(); draw(); toast(q.open ? "Quiz closed." : "Quiz reopened."); }
        catch (e) { toast(message(e), "err"); b.disabled = false; }
      });
      view.querySelectorAll("[data-archive]").forEach(b => b.onclick = async () => {
        if (!confirm("Archive this quiz? It closes and disappears from this list. Answers stay in your Google Sheet.")) return;
        try { await api("deleteQuiz", { id: b.dataset.archive }); await loadQuizzes(); draw(); toast("Archived."); }
        catch (e) { toast(message(e), "err"); }
      });
    };
    draw();
    poll(async () => { try { await loadQuizzes(); if (location.hash.replace("#", "") in { "": 1, quizzes: 1 }) draw(); } catch (e) {} }, 30000);
  }

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Student link copied."); }
    catch (e) { prompt("Copy this link:", text); }
  }

  /* ---------- builder ---------- */
  async function renderBuilder(editId, preset) {
    stopPoll(); setBar(""); navCurrent(editId ? null : "new");
    let q = { title: "", className: "", minutes: 0, instructions: "", showMs: true, allowResubmit: true, open: true, items: [] };
    if (editId) {
      if (!quizzes.length) await loadQuizzes();
      const found = quizzes.find(x => x.id === editId);
      if (!found) { view.innerHTML = `<div class="card narrow" style="margin-top:3rem"><p>That quiz wasn't found.</p></div>`; return; }
      q = Object.assign({}, found);
    } else if (preset && preset.length) {
      q.items = preset.filter(id => BY_ID[id]);
    }
    let sel = q.items.slice();
    const filt = { paper: new Set(), topic: new Set(), text: "" };

    view.innerHTML = `<div class="pagehead"><p class="eyebrow">${editId ? "Edit quiz" : "New quiz"}</p><h1>${editId ? esc(q.title) : "Build a quiz"}</h1>
      <p>Choose questions from the bank, set the options, and save. You'll get a link to share with your class.</p></div>
      <form class="card" id="bform" novalidate>
        <div class="grid2">
          <div class="field"><label for="btitle">Title</label><input id="btitle" type="text" maxlength="120" value="${esc(q.title)}" placeholder="e.g. Sequences unit formative"></div>
          <div class="field"><label for="bclass">Class</label><input id="bclass" type="text" maxlength="60" value="${esc(q.className)}" placeholder="e.g. DP1 AA HL"></div>
          <div class="field"><label for="bmin">Time limit (minutes)</label><input id="bmin" type="number" min="0" max="300" value="${q.minutes || 0}">
            <small id="bsuggest"></small></div>
        </div>
        <div class="field"><label for="binstr">Instructions for students (optional)</label><textarea id="binstr" rows="2" maxlength="1000" placeholder="e.g. Show all working. Calculator allowed for Q3 only.">${esc(q.instructions)}</textarea></div>
        <label class="check"><input type="checkbox" id="bms" ${q.showMs ? "checked" : ""}><span>Show the markscheme to students once their feedback is returned</span></label>
        <label class="check"><input type="checkbox" id="bre" ${q.allowResubmit ? "checked" : ""}><span>Let students revise and resubmit after feedback</span></label>
        <label class="check"><input type="checkbox" id="bopen" ${q.open ? "checked" : ""}><span>Open for answers now</span></label>
      </form>
      <div class="picker">
        <div>
          <div class="pickfilters" id="fpaper">${[1, 2, 3, 0].map(p => `<button type="button" class="chipf" data-p="${p}" aria-pressed="false">${PAPER[p]}</button>`).join("")}</div>
          <div class="pickfilters" id="ftopic">${Object.keys(TOPIC).map(t => `<button type="button" class="chipf" data-t="${t}" aria-pressed="false"><span class="dot" style="background:${TOPIC[t][1]}"></span>${TOPIC[t][0]}</button>`).join("")}</div>
          <input class="search" id="fsearch" type="search" placeholder="Search by code (SL 1.2), id (P1-04) or phrase" style="width:100%;margin-bottom:1.2rem">
          <div class="picklist" id="plist" role="list"></div>
        </div>
        <aside class="chosen" aria-label="Chosen questions">
          <div class="tot"><span id="ccount"></span><span id="cmarks"></span></div>
          <ol id="clist"></ol>
          <p class="err" id="berr" role="alert"></p>
          <button class="btn primary big" type="button" id="bsave" style="width:100%">${editId ? "Save changes" : "Create quiz"}</button>
        </aside>
      </div>`;

    const plist = $("plist");
    const rowsHTML = () => ITEMS.filter(it =>
      (!filt.paper.size || filt.paper.has(it.paper)) && (!filt.topic.size || filt.topic.has(it.topic)) &&
      (!filt.text || (it.id + " " + it.title + " " + it.codes.join(" ") + " " + stripTags(it.context || "") + " " + it.parts.map(p => stripTags(p.q)).join(" ")).toLowerCase().includes(filt.text))
    ).map(it => `<label class="pickrow" role="listitem"><input type="checkbox" data-id="${it.id}" ${sel.includes(it.id) ? "checked" : ""}>
        <span class="iid">${it.id}</span><span class="t">${it.title}<small>${PAPER[it.paper]} &middot; ${it.codes.join(", ")}</small></span><span class="mk">${it.max} mk</span></label>`).join("") || `<p class="hint" style="padding:1.6rem">No questions match.</p>`;
    const drawList = () => { plist.innerHTML = rowsHTML(); };
    const drawChosen = () => {
      const marks = quizMax(sel);
      $("ccount").textContent = `${sel.length} question${sel.length === 1 ? "" : "s"}`;
      $("cmarks").textContent = `${marks} marks`;
      $("clist").innerHTML = sel.map((id, i) => `<li><span class="n">${i + 1}</span><span><b>${id}</b> ${BY_ID[id].title}</span>
        <span class="ctl"><button type="button" data-up="${i}" aria-label="Move up" ${i === 0 ? "disabled" : ""}>↑</button><button type="button" data-down="${i}" aria-label="Move down" ${i === sel.length - 1 ? "disabled" : ""}>↓</button><button type="button" data-rm="${i}" aria-label="Remove">×</button></span></li>`).join("")
        || `<li style="display:block" class="hint">Tick questions on the left to add them.</li>`;
      // IB papers run at roughly 1 minute per mark.
      $("bsuggest").innerHTML = marks ? `About ${marks} min at the exam pace of ~1 min per mark. <button type="button" class="linkbtn" id="usesug">Use ${marks}</button> &middot; 0 = no limit` : "0 = no limit";
      const us = $("usesug"); if (us) us.onclick = () => { $("bmin").value = marks; dirty = true; };
    };
    plist.addEventListener("change", e => {
      const id = e.target.dataset.id; if (!id) return;
      if (e.target.checked) { if (!sel.includes(id)) sel.push(id); } else sel = sel.filter(x => x !== id);
      dirty = true; drawChosen();
    });
    $("clist").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const i = +(b.dataset.up ?? b.dataset.down ?? b.dataset.rm);
      if (b.dataset.up != null) [sel[i - 1], sel[i]] = [sel[i], sel[i - 1]];
      else if (b.dataset.down != null) [sel[i + 1], sel[i]] = [sel[i], sel[i + 1]];
      else sel.splice(i, 1);
      dirty = true; drawChosen(); drawList();
    });
    const chipToggle = (wrap, setRef, attr) => wrap.addEventListener("click", e => {
      const b = e.target.closest(".chipf"); if (!b) return;
      const v = +b.dataset[attr], on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      on ? setRef.add(v) : setRef.delete(v); drawList();
    });
    chipToggle($("fpaper"), filt.paper, "p");
    chipToggle($("ftopic"), filt.topic, "t");
    $("fsearch").addEventListener("input", e => { filt.text = e.target.value.trim().toLowerCase(); drawList(); });
    $("bform").addEventListener("input", () => { dirty = true; });
    drawList(); drawChosen();

    $("bsave").onclick = async () => {
      $("berr").textContent = "";
      if (!sel.length) { $("berr").textContent = message({ code: "no_items" }); return; }
      const body = { id: editId || undefined, title: $("btitle").value.trim() || "Untitled quiz", className: $("bclass").value.trim(),
        minutes: Math.max(0, Math.min(300, parseInt($("bmin").value, 10) || 0)), instructions: $("binstr").value.trim(),
        showMs: $("bms").checked, allowResubmit: $("bre").checked, open: $("bopen").checked, items: sel };
      $("bsave").disabled = true;
      try {
        const r = await api("saveQuiz", { quiz: body });
        dirty = false;
        if (!editId) store.del("mb-quiz-pick");
        await loadQuizzes();
        history.replaceState(null, "", location.pathname + "#quizzes");
        renderSaved(r.quiz, !editId);
      } catch (e) { $("berr").textContent = message(e); $("bsave").disabled = false; }
    };
  }

  function renderSaved(q, isNew) {
    navCurrent(null);
    const link = studentLink(q.id);
    view.innerHTML = `<div class="pagehead"><p class="eyebrow">${isNew ? "Quiz created" : "Quiz saved"}</p><h1>${esc(q.title)}</h1></div>
      <div class="card narrow"><h2>Share this link with your class</h2>
        <p>Students open it, enter their name and a PIN, and answer. You'll see their answers under <b>Answers &amp; marking</b>.</p>
        <div class="linkbox"><input type="text" readonly value="${esc(link)}" id="slink" aria-label="Student link"><button class="btn primary" id="scopy">Copy</button></div>
        <div class="btnrow" style="margin-top:2rem"><a class="btn" href="#subs/${q.id}" style="text-decoration:none">Go to answers</a><a class="btn" href="${esc(link)}" target="_blank" rel="noopener" style="text-decoration:none">Preview as a student</a><a class="btn" href="#quizzes" style="text-decoration:none">All quizzes</a></div>
      </div>`;
    $("scopy").onclick = () => copy(link);
    $("slink").onfocus = e => e.target.select();
  }

  /* ---------- submissions ---------- */
  async function renderSubs(quizId) {
    stopPoll(); setBar(""); navCurrent(null);
    if (!quizzes.length) await loadQuizzes();
    const q = quizzes.find(x => x.id === quizId);
    if (!q) { view.innerHTML = `<div class="card narrow" style="margin-top:3rem"><p>That quiz wasn't found.</p></div>`; return; }
    const max = quizMax(q.items);
    let seen = {}, sortBy = "status";
    view.innerHTML = `<div class="pagehead"><p class="eyebrow"><a href="#quizzes">Quizzes</a> / Answers</p><h1>${esc(q.title)}</h1>
        <div class="meta">${q.className ? `<span>${esc(q.className)}</span>` : ""}<span>${q.items.length} questions &middot; ${max} marks</span><span class="pill ${q.open ? "open" : "closed"}">${q.open ? "Open" : "Closed"}</span><span id="live" class="hint"></span></div>
        <div class="btnrow" style="margin-top:1.6rem"><button class="btn" id="copyl">Copy student link</button>
          <label class="hint">Sort <select id="sort" style="width:auto;font-size:1.5rem;padding:.5rem .8rem"><option value="status">To mark first</option><option value="name">Name</option><option value="time">Most recent</option><option value="score">Score</option></select></label></div></div>
      <div id="sumcards"></div>
      <div class="tablewrap"><table class="data"><thead><tr><th>Student</th><th>Status</th><th>Attempt</th><th>Submitted</th><th>Time taken</th><th>Score</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="hint">Loading…</td></tr></tbody></table></div>`;
    $("copyl").onclick = () => copy(studentLink(q.id));
    $("sort").onchange = e => { sortBy = e.target.value; draw(); };

    const order = { submitted: 0, resubmitted: 0, marking: 1, returned: 2 };
    function draw() {
      const subs = (subsByQuiz[quizId] || []).slice();
      subs.sort((a, b) => sortBy === "name" ? a.name.localeCompare(b.name)
        : sortBy === "time" ? b.submittedAt.localeCompare(a.submittedAt)
        : sortBy === "score" ? (b.score ?? -1) - (a.score ?? -1)
        : (order[a.status] - order[b.status]) || a.submittedAt.localeCompare(b.submittedAt));
      const waiting = subs.filter(s => s.status !== "returned").length;
      const ret = subs.filter(s => s.status === "returned" && s.score != null);
      const avg = ret.length ? (ret.reduce((t, s) => t + s.score, 0) / ret.length) : null;
      $("sumcards").innerHTML = `<dl class="facts" style="margin:0 0 2.4rem"><div class="fact"><dt>Submissions</dt><dd>${subs.length}</dd></div>
        <div class="fact"><dt>To mark</dt><dd>${waiting}</dd></div><div class="fact"><dt>Returned</dt><dd>${subs.length - waiting}</dd></div>
        <div class="fact"><dt>Mean score</dt><dd>${avg == null ? "–" : avg.toFixed(1)}<small>${avg == null ? "of returned work" : "/ " + max + " (" + Math.round(100 * avg / max) + "%)"}</small></dd></div></dl>`;
      const tb = $("tb");
      tb.innerHTML = subs.length ? subs.map(s => {
        const fresh = seen[s.studentKey] && seen[s.studentKey] !== s.submittedAt + s.status;
        return `<tr class="clickable${fresh ? " fresh" : ""}" data-k="${esc(s.studentKey)}" tabindex="0">
          <td><b>${esc(s.name)}</b></td><td><span class="pill ${esc(s.status)}">${STATUS_LABEL[s.status] || esc(s.status)}</span></td>
          <td class="num">${s.attempt}</td><td>${esc(when(s.submittedAt))}</td><td>${esc(duration(s.elapsed))}</td>
          <td class="num">${s.score == null || s.status !== "returned" && s.status !== "marking" ? "–" : s.score + " / " + max}</td></tr>`;
      }).join("") : `<tr><td colspan="6"><div class="hint" style="padding:1.2rem 0">No answers yet. This list updates by itself as students submit.</div></td></tr>`;
      subs.forEach(s => { seen[s.studentKey] = s.submittedAt + s.status; });
      tb.querySelectorAll("tr.clickable").forEach(tr => {
        const go = () => { location.hash = "mark/" + quizId + "/" + encodeURIComponent(tr.dataset.k); };
        tr.onclick = go; tr.onkeydown = e => { if (e.key === "Enter") go(); };
      });
    }
    const refresh = async () => {
      const r = await api("listSubs", { quizId });
      const before = (subsByQuiz[quizId] || []).map(s => s.studentKey + s.submittedAt).join();
      subsByQuiz[quizId] = r.subs;
      if (before !== r.subs.map(s => s.studentKey + s.submittedAt).join() || !$("tb").dataset.drawn) { $("tb").dataset.drawn = 1; draw(); }
      $("live").textContent = "Live · updated " + when(r.at);
    };
    await refresh();
    subsByQuiz[quizId].forEach(s => { seen[s.studentKey] = s.submittedAt + s.status; });
    poll(() => refresh().catch(() => { $("live").textContent = "Live updates paused: can't reach the sheet"; }), 12000);
  }

  /* ---------- marking ---------- */
  async function renderMark(quizId, sk) {
    stopPoll(); navCurrent(null);
    if (!quizzes.length) await loadQuizzes();
    const q = quizzes.find(x => x.id === quizId);
    if (!q) { view.innerHTML = `<div class="card narrow" style="margin-top:3rem"><p>That quiz wasn't found.</p></div>`; return; }
    const r = await api("listSubs", { quizId });
    subsByQuiz[quizId] = r.subs;
    const s = r.subs.find(x => x.studentKey === sk);
    if (!s) { view.innerHTML = `<div class="card narrow" style="margin-top:3rem"><p>That submission wasn't found.</p><a href="#subs/${quizId}">Back to answers</a></div>`; return; }
    const items = q.items.filter(id => BY_ID[id]);
    const max = quizMax(items);
    const fb = s.feedback || { parts: {}, items: {}, overall: "" };
    const prevAttempt = (s.history || []).slice(-1)[0];

    view.innerHTML = `<div class="pagehead"><p class="eyebrow"><a href="#quizzes">Quizzes</a> / <a href="#subs/${quizId}">${esc(q.title)}</a> / Marking</p>
        <div class="markhead"><h1>${esc(s.name)}</h1><span class="pill ${esc(s.status)}">${STATUS_LABEL[s.status] || esc(s.status)}</span></div>
        <div class="meta"><span>Attempt <b>${s.attempt}</b></span><span>Submitted <b>${esc(when(s.submittedAt))}</b></span>${s.elapsed ? `<span>Took <b>${esc(duration(s.elapsed))}</b></span>` : ""}
          ${prevAttempt ? `<span>Previous score <b>${prevAttempt.score === "" || prevAttempt.score == null ? "–" : esc(prevAttempt.score) + " / " + max}</b></span>` : ""}</div>
        <div id="stale" class="note" style="margin-top:1.6rem;border-left-color:var(--ox)" hidden><strong>${esc(s.name)} has changed their answers since you opened this.</strong> <button class="linkbtn" id="reload">Reload their latest answers</button> (your unsaved marks on this page will be lost).</div></div>
      ${prevAttempt ? `<div class="history"><details><summary>What you said on attempt ${prevAttempt.attempt}</summary><div class="hbody">
        ${prevAttempt.feedback && prevAttempt.feedback.overall ? `<p style="white-space:pre-wrap">${esc(prevAttempt.feedback.overall)}</p>` : ""}
        ${items.map(id => BY_ID[id].parts.map((p, k) => { const f = prevAttempt.feedback && prevAttempt.feedback.parts && prevAttempt.feedback.parts[id] && prevAttempt.feedback.parts[id][k];
          const a = ((prevAttempt.answers || {})[id] || {})[k] || "";
          return `<div class="hpart"><b>${id} ${p.l}</b><div><div style="white-space:pre-wrap">${a.trim() ? esc(a) : "<i>No answer</i>"}</div>${f ? `<div class="hint">${f.marks == null ? "" : f.marks + "/" + p.m + " "}${esc(f.comment || "")}</div>` : ""}</div></div>`; }).join("")).join("")}
      </div></details></div>` : ""}
      <div class="items" id="mitems">${items.map((id, n) => {
        const it = BY_ID[id];
        return `<article class="item">${headerHTML(it, n + 1)}
          <div class="qbody qwrap">${it.context || ""}</div>
          ${it.parts.map((p, k) => {
            const a = ((s.answers || {})[id] || {})[k] || "";
            const f = (fb.parts[id] || {})[k] || {};
            const was = prevAttempt && ((prevAttempt.answers || {})[id] || {})[k];
            const changed = prevAttempt && (was || "") !== a;
            return `<div class="markpart"><span class="pl">${p.l}</span>
              <div class="pq"><span>${p.q}</span> <span class="pm">[${p.m}]</span></div>
              <div class="slot">
                <div><div class="lbl" style="margin-bottom:.4rem">Student answer${changed ? ` <span class="pill resubmitted" style="margin-left:.6rem">Changed</span>` : ""}</div>
                  <div class="answer-ro ${a.trim() ? "" : "empty"}">${a.trim() ? esc(a) : "No answer"}</div>
                  <label class="sr" for="c-${id}-${k}">Comment on ${id} ${p.l}</label>
                  <textarea class="comment" id="c-${id}-${k}" data-id="${id}" data-k="${k}" placeholder="Comment for the student (optional). Click here for quick comments." maxlength="2000" style="margin-top:1rem">${esc(f.comment || "")}</textarea>
                  <div class="chips" data-for="c-${id}-${k}">${COMMENTS.map(c => `<button type="button" class="chip">${esc(c)}</button>`).join("")}</div>
                </div>
                <div class="mk"><span class="lbl">Marks</span>
                  <div class="mkrow"><input type="number" min="0" max="${p.m}" step="1" class="marks" data-id="${id}" data-k="${k}" data-max="${p.m}" value="${f.marks == null ? "" : f.marks}" aria-label="Marks for ${id} ${p.l}"> / ${p.m}</div>
                  ${p.m <= 10 ? `<div class="quick" data-id="${id}" data-k="${k}">${Array.from({ length: p.m + 1 }, (_, v) => `<button type="button" data-v="${v}" aria-pressed="${f.marks === v}">${v}</button>`).join("")}</div>` : ""}
                </div>
              </div></div>`;
          }).join("")}
          <div class="itemcomment"><label class="lbl" for="ic-${id}">Comment on the whole question (optional)</label>
            <textarea class="comment" id="ic-${id}" data-item="${id}" maxlength="2000" style="margin-top:.6rem">${esc((fb.items || {})[id] || "")}</textarea></div>
          <details class="ms" open><summary>Markscheme</summary><div class="msbody">${msHTML(it)}</div></details>
        </article>`;
      }).join("")}</div>
      <div class="card" style="margin-top:2.4rem"><label class="lbl" for="overall">Overall feedback</label>
        <textarea class="comment" id="overall" maxlength="2000" rows="4" style="margin-top:.6rem" placeholder="What went well, and the one thing to work on next">${esc(fb.overall || "")}</textarea></div>`;

    const root = $("mitems");
    const total = () => [...view.querySelectorAll("input.marks")].reduce((t, i) => t + (i.value === "" ? 0 : Math.max(0, Math.min(+i.dataset.max, +i.value || 0))), 0);
    const unmarked = () => [...view.querySelectorAll("input.marks")].filter(i => i.value === "").length;
    const waitingNext = () => (subsByQuiz[quizId] || []).filter(x => x.studentKey !== sk && x.status !== "returned" && x.status !== "marking")
      .sort((a, b) => a.submittedAt.localeCompare(b.submittedAt))[0];
    const drawBar = () => {
      const nx = waitingNext();
      setBar(`<div class="markbar"><div class="wrap">
        <span class="total" id="mtotal">${total()} / ${max}</span><span class="hint" id="munmarked">${unmarked() ? unmarked() + " part" + (unmarked() === 1 ? "" : "s") + " unmarked" : "All parts marked"}</span>
        <span style="flex:1"></span>
        <button class="btn" id="fullmarks" type="button">Fill blanks with 0</button>
        <button class="btn" id="draft" type="button">Save draft</button>
        <button class="btn primary big" id="ret" type="button">Return to student</button>
        ${nx ? `<a class="btn" href="#mark/${quizId}/${encodeURIComponent(nx.studentKey)}" style="text-decoration:none">Next: ${esc(nx.name)} →</a>` : ""}
      </div></div>`);
      $("draft").onclick = () => save("marking");
      $("ret").onclick = () => save("returned");
      $("fullmarks").onclick = () => { view.querySelectorAll("input.marks").forEach(i => { if (i.value === "") { i.value = 0; syncQuick(i); } }); dirty = true; updTotal(); };
    };
    const updTotal = () => { const t = $("mtotal"); if (t) { t.textContent = `${total()} / ${max}`; const u = unmarked(); $("munmarked").textContent = u ? `${u} part${u === 1 ? "" : "s"} unmarked` : "All parts marked"; } };
    const syncQuick = inp => {
      const qk = view.querySelector(`.quick[data-id="${inp.dataset.id}"][data-k="${inp.dataset.k}"]`);
      if (qk) qk.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", inp.value !== "" && +b.dataset.v === +inp.value ? "true" : "false"));
    };
    view.oninput = e => {
      if (e.target.matches("input.marks")) {
        const m = +e.target.dataset.max;
        if (e.target.value !== "" && (+e.target.value > m || +e.target.value < 0)) e.target.value = Math.max(0, Math.min(m, +e.target.value));
        syncQuick(e.target); updTotal();
      }
      if (e.target.matches("input, textarea")) dirty = true;
    };
    // keep focus in the comment box so its chips stay visible while clicking one
    root.addEventListener("mousedown", e => { if (e.target.closest(".chip, .quick button")) e.preventDefault(); });
    root.addEventListener("click", e => {
      const qb = e.target.closest(".quick button");
      if (qb) {
        const w = qb.parentElement, inp = view.querySelector(`input.marks[data-id="${w.dataset.id}"][data-k="${w.dataset.k}"]`);
        inp.value = qb.dataset.v; syncQuick(inp); updTotal(); dirty = true; return;
      }
      const chip = e.target.closest(".chip");
      if (chip) {
        const ta = $(chip.parentElement.dataset.for);
        ta.value = (ta.value.trim() ? ta.value.trim() + " " : "") + chip.textContent; dirty = true; ta.focus();
      }
    });
    drawBar();

    async function save(status) {
      const un = unmarked();
      if (status === "returned" && un && !confirm(`${un} part${un === 1 ? " has" : "s have"} no mark. Return anyway? Unmarked parts count as 0 in the total.`)) return;
      const parts = {};
      view.querySelectorAll("input.marks").forEach(i => {
        const c = $(`c-${i.dataset.id}-${i.dataset.k}`).value.trim();
        (parts[i.dataset.id] = parts[i.dataset.id] || {})[i.dataset.k] = { marks: i.value === "" ? null : Math.max(0, Math.min(+i.dataset.max, parseInt(i.value, 10) || 0)), comment: c };
      });
      const itemC = {};
      view.querySelectorAll("textarea[data-item]").forEach(t => { if (t.value.trim()) itemC[t.dataset.item] = t.value.trim(); });
      const btns = [$("draft"), $("ret")]; btns.forEach(b => b.disabled = true);
      try {
        await api("saveFeedback", { quizId, studentKey: sk, submittedAt: s.submittedAt, status, max,
                                    feedback: { parts, items: itemC, overall: $("overall").value.trim() } });
        dirty = false;
        const list = await api("listSubs", { quizId }); subsByQuiz[quizId] = list.subs;
        if (status === "returned") {
          toast(`Returned to ${s.name}. They'll see it straight away.`);
          const nx = waitingNext();
          location.hash = nx ? "mark/" + quizId + "/" + encodeURIComponent(nx.studentKey) : "subs/" + quizId;
        } else { toast("Draft saved. The student can't see it yet."); drawBar(); }
      } catch (e) {
        toast(message(e), "err");
        if (e.code === "stale_answers") $("stale").hidden = false;
        btns.forEach(b => b.disabled = false);
      }
    }
    $("reload").onclick = () => { dirty = false; route(); };
    // Warn if the student resubmits while this page is open.
    poll(async () => {
      try {
        const l = await api("listSubs", { quizId }); subsByQuiz[quizId] = l.subs;
        const now = l.subs.find(x => x.studentKey === sk);
        if (now && now.submittedAt !== s.submittedAt) $("stale").hidden = false;
      } catch (e) {}
    }, 20000);
    window.scrollTo({ top: 0 });
  }

  route();
})();
</script>
</body>
</html>
